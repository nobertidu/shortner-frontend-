# put this at /etc/nginx/sites-available/shortener
# then: sudo ln -s /etc/nginx/sites-available/shortener /etc/nginx/sites-enabled/shortener
#       sudo nginx -t && sudo systemctl reload nginx

server {
    listen 4001;
    server_name _;

    root /var/www/shortener-frontend;
    index index.html;

    # react single page app: unknown paths fall back to index.html
    location / {
        try_files $uri /index.html;
    }

    # backend api
    location /api/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # the short links themselves. NEW in this project: without this block,
    # /s/abc123 would show the react page instead of redirecting.
    location /s/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
